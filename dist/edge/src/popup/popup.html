<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIU Portal Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-system">
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">UIU Monitor</h1>
          <span class="brand-subtitle">Academic Portals</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnOpenDashboard" class="icon-btn" title="Open Full Dashboard" aria-label="Open Full Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Portal Status Cards -->
    <section class="portal-grid">
      <!-- UCAM Status Card -->
      <div class="portal-card" id="cardUcam">
        <div class="portal-card-header">
          <span class="portal-name">UCAM</span>
          <span class="status-badge" id="ucamStatusBadge">Checking...</span>
        </div>
        <div class="portal-card-body">
          <div class="status-detail">
            <span class="detail-label">Last check:</span>
            <span class="detail-val" id="ucamLastCheck">Never</span>
          </div>
        </div>
        <div class="portal-card-footer">
          <a href="https://ucam.uiu.ac.bd/Security/LogIn.aspx" target="_blank" class="portal-link" rel="noreferrer">
            Open UCAM &rarr;
          </a>
        </div>
      </div>

      <!-- eLMS Status Card -->
      <div class="portal-card" id="cardElms">
        <div class="portal-card-header">
          <span class="portal-name">eLMS</span>
          <span class="status-badge" id="elmsStatusBadge">Checking...</span>
        </div>
        <div class="portal-card-body">
          <div class="status-detail">
            <span class="detail-label">Last check:</span>
            <span class="detail-val" id="elmsLastCheck">Never</span>
          </div>
        </div>
        <div class="portal-card-footer">
          <a href="https://elms.uiu.ac.bd/login/index.php" target="_blank" class="portal-link" rel="noreferrer">
            Open eLMS &rarr;
          </a>
        </div>
      </div>
    </section>

    <!-- Action Bar -->
    <div class="action-bar">
      <button id="btnCheckNow" class="btn btn-primary">
        <span class="btn-spinner" id="btnSpinner" style="display: none;"></span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span id="btnCheckNowText">Check Now</span>
      </button>
      <div class="next-alarm-info" id="nextAlarmInfo">
        Next scan in ~30 min
      </div>
    </div>

    <!-- Recent Alerts -->
    <section class="recent-alerts-section">
      <div class="section-header">
        <h2 class="section-title">Recent Updates</h2>
        <span class="unread-pill" id="unreadPill">0 new</span>
      </div>
      <div class="alerts-list" id="alertsList">
        <div class="empty-state" id="emptyAlerts">
          No new academic updates. All caught up!
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="footer-note">Local-first &bull; Zero credentials stored</span>
      <a href="../dashboard/dashboard.html#settings" target="_blank" class="footer-link">Settings</a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
